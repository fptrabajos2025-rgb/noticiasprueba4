<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Radio Crucero</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style id="css">
/* 1. VARIABLES */
:root{--bg:#eaf2fc;--sf:#fff;--ink:#0b1b33;--mu:#53657f;--ln:#d3e1f4;--nv:#0a2a5e;--bl:#1456d6;--sk:#ffc20e;--ice:#e8f3ff;--lg:#0a2a5e;--sh:0 1px 2px rgba(10,42,94,.06),0 10px 26px rgba(10,42,94,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#07111f;--sf:#0e1d33;--ink:#eaf2ff;--mu:#9bb0cc;--ln:#1c3253;--nv:#04122a;--bl:#6aa0ff;--ice:#12294a;--lg:#eaf2ff;--sh:0 8px 26px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07111f;--sf:#0e1d33;--ink:#eaf2ff;--mu:#9bb0cc;--ln:#1c3253;--nv:#04122a;--bl:#6aa0ff;--ice:#12294a;--lg:#eaf2ff;--sh:0 8px 26px rgba(0,0,0,.35)}
/* 2. BASE */
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--ice) 0,var(--bg) 380px) var(--bg);color:var(--ink);font:400 17px/1.55 "Source Sans 3","Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;line-height:1.05;margin:0}
a{color:inherit}img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 18px}
.pg{padding-bottom:34px}
.when,.by{color:var(--mu);font-size:15px}
.pill{display:inline-block;background:var(--ice);color:var(--bl);font-weight:600;font-size:14px;padding:1px 10px;border-radius:99px;border:1px solid var(--ln)}
.pill.u{background:#ffe3e3;color:#c01b1f;border-color:#f6bcbc}
/* 3. BARRA SUPERIOR, CABECERA Y MENÚ */
.top{background:var(--nv);color:#fff;font-size:15px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.rb{background:var(--sk);color:#04142e;border:0;border-radius:99px;padding:5px 14px;font:600 15px "Source Sans 3",Arial,sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;text-decoration:none}
.dot{width:9px;height:9px;border-radius:50%;background:#e5252a;animation:pulse 1.4s infinite;flex:none}
@keyframes pulse{to{box-shadow:0 0 0 9px rgba(229,37,42,0)}}
.head{background:var(--sf);border-bottom:3px solid var(--bl);box-shadow:0 4px 14px rgba(10,42,94,.08)}
.head .wrap{display:flex;align-items:center;gap:24px;padding-top:12px;padding-bottom:10px;flex-wrap:wrap}
.logo{font:700 36px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--lg);text-decoration:none}
.logo b{background:var(--bl);color:#fff;padding:0 8px;margin-right:6px;border-radius:4px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{white-space:nowrap;text-decoration:none;font-weight:600;padding:8px 14px;border-radius:99px}
nav a:hover{background:var(--ice);color:var(--bl)}
.tick{background:var(--bl);color:#fff;overflow:hidden;display:flex}
.tick strong{background:var(--nv);padding:7px 16px;white-space:nowrap;font:700 20px "Barlow Condensed","Arial Narrow",Arial,sans-serif;position:relative;z-index:1}
.tick div{display:flex;white-space:nowrap;animation:run 40s linear infinite}
.tick span{padding:7px 28px}
@keyframes run{to{transform:translateX(-50%)}}
/* 4. PANELES (cada sección es un cuadro con cabecera) */
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);overflow:hidden;margin-top:22px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 20px;background:linear-gradient(90deg,var(--ice),transparent);border-bottom:1px solid var(--ln);border-left:6px solid var(--bl)}
.ph h2{font-size:30px;font-weight:700;color:var(--lg)}
.pb{padding:18px 20px}
.more{font-weight:600;color:var(--bl);text-decoration:none;white-space:nowrap}
.more:hover{text-decoration:underline}
.top2{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:0 22px;align-items:stretch}
.top2>.pn:first-child{display:flex;flex-direction:column}.top2>.pn:first-child .big{flex:1}
/* 5. NOTICIA DEL DÍA */
.big{position:relative;display:flex;align-items:flex-end;min-height:430px;color:#fff;background:var(--nv);text-decoration:none;overflow:hidden}
.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 14s ease-out forwards}
@keyframes zoom{from{transform:scale(1.12)}}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(4,18,42,.92),rgba(4,18,42,.05) 65%)}
.big div{position:relative;z-index:1;padding:24px;animation:up .8s .2s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.big h1{font-size:clamp(34px,5vw,52px);margin:8px 0}
.big p{margin:0;max-width:60ch}.big .pill{background:var(--sk);color:#04142e;border:0}.big .by{color:#dbe8ff}
/* 6. RADIO Y COMUNICADOS (columna lateral) */
.radiocard{background:linear-gradient(135deg,var(--nv),var(--bl));color:#fff;border:0}
.radiocard .ph{background:transparent;border-bottom:1px solid rgba(255,255,255,.22);border-left-color:var(--sk)}
.radiocard h2{color:#fff}
.rn{font:700 32px/1.05 "Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:0 0 14px}
.radiocard .btn{background:var(--sk);color:#04142e;display:flex;gap:10px;justify-content:center;align-items:center;font-size:18px;padding:12px}
.radiocard .by{color:#dbe8ff;margin:10px 0 0}
.ci{display:block;padding:12px 0;border-top:1px solid var(--ln);text-decoration:none}
.ci:first-child{border-top:0;padding-top:0}
.ci h3{font-size:23px;font-weight:700;margin:6px 0 2px}
.ci:hover h3{color:var(--bl)}
/* 7. TARJETAS DE NOTICIAS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;text-decoration:none;transition:transform .2s,box-shadow .2s;display:block}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(20,86,214,.18)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover}
.card div{padding:12px 14px 16px}
.card h3{font-size:24px;margin:6px 0 4px;font-weight:700}
.card p{margin:0 0 4px;color:var(--mu);font-size:16px}
/* 8. CONVOCATORIAS DE TRABAJO */
.jobsP{background:linear-gradient(135deg,var(--nv),var(--bl));color:#fff;border:0}
.jobsP .ph{background:rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.2);border-left-color:#fff}
.jobsP .ph h2{font-size:clamp(36px,6vw,58px);color:#fff}
.jobsP .more{color:#fff}
.lead2{margin:0 0 16px;font-size:18px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.job{background:#fff;color:#0b1b33;border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;border-bottom:6px solid var(--sk);text-decoration:none;transition:transform .2s}
.job:hover{transform:translateY(-3px)}
.job h3{font-size:26px;font-weight:700}.job small{color:#53657f;font-size:15px}
.new{align-self:flex-start;background:#e5252a;color:#fff;font-size:13px;font-weight:600;padding:0 9px;border-radius:99px}
.job .cl{font-weight:600;color:#1456d6}
/* 9. BOTONES */
.btn,.b{display:inline-block;background:var(--bl);color:#fff;border:0;border-radius:8px;padding:9px 18px;font:600 16px "Source Sans 3",Arial,sans-serif;text-decoration:none;cursor:pointer}
.b.o{background:transparent;color:var(--bl);border:1.5px solid var(--bl)}.b.r{background:#c01b1f}
.b:disabled{opacity:.4;cursor:default}
/* 10. PÁGINAS DE DETALLE Y LISTAS (se abren en otra pestaña) */
.det{max-width:860px;width:calc(100% - 24px);margin:22px auto;padding:28px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh)}
.det h1{font-size:clamp(36px,6vw,56px);margin:8px 0}
.back{color:var(--bl);font-weight:600;display:inline-block;margin-bottom:10px;text-decoration:none}
.cover{width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:10px;margin:12px 0}
.det .lead{font-size:20px;font-weight:600}
h2.sec{font-size:32px;font-weight:700;color:var(--lg);margin:24px 0 10px;padding-left:12px;border-left:6px solid var(--sk)}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;background:var(--ice);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin:14px 0}
.dl dt{color:var(--mu);font-weight:600}.dl dd{margin:0}
.cta{background:var(--ice);border:1px solid var(--ln);border-left:6px solid var(--bl);border-radius:10px;padding:14px 18px;margin:18px 0}
.cta h3{font-size:26px;margin-bottom:6px}.cta .btn{margin:6px 8px 0 0}
.dia{font:700 24px "Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:22px 0 6px;color:var(--lg);padding-bottom:4px;border-bottom:2px solid var(--ln)}
.row{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--ln);align-items:center;text-decoration:none}
.row img{width:120px;aspect-ratio:16/10;object-fit:cover;border-radius:6px}
.row h3{font-size:23px;font-weight:700;margin:2px 0}.row.t{grid-template-columns:1fr}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs a,.tabs button{font:600 16px "Source Sans 3",Arial,sans-serif;padding:7px 16px;border-radius:99px;border:1.5px solid var(--bl);background:transparent;color:var(--bl);cursor:pointer;text-decoration:none}
.tabs .on{background:var(--bl);color:#fff}
/* 11. PANEL DE ADMINISTRACIÓN */
.frm{display:grid;gap:12px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-top:12px}
.frm label{display:grid;gap:4px;font-weight:600}
.frm input,.frm select,.frm textarea{font:400 16px "Source Sans 3",Arial,sans-serif;padding:8px 10px;border:1.5px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink);width:100%}
.frm label.ck{display:flex;gap:8px;align-items:center;font-weight:400}.frm label.ck input{width:auto}
.frm fieldset{border:1.5px solid var(--ln);border-radius:8px}
.err{color:#c01b1f;font-weight:600;margin:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.adm{max-width:980px}.adm .row{grid-template-columns:1fr auto}.adm .row div:last-child{display:flex;gap:6px;flex-wrap:wrap}
.adm .b{padding:5px 12px;font-size:15px}.adm .bar .b{padding:9px 18px;font-size:16px}
/* 11b. LOGO Y ADMINISTRACIÓN POR PESTAÑAS */
.logo{display:flex;align-items:center;gap:8px}
.logo img{height:80px;width:auto;background:#fff;border-radius:8px;padding:2px 8px}
.abar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sf);padding:6px 0 10px;border-bottom:1px solid var(--ln)}
.who b{font-size:21px;display:block;line-height:1.1}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.unsaved{background:#fff4cc;color:#6b4e00;border:1px solid #f2d77a;padding:3px 12px;border-radius:99px;font-size:14px;font-weight:600}
.atabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--ln);margin-top:12px;scrollbar-width:none}
.atabs button{background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:12px 16px;font:600 17px "Source Sans 3",Arial,sans-serif;color:var(--mu);cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.atabs button:hover{color:var(--bl)}
.atabs button.on{color:var(--bl);border-bottom-color:var(--sk)}
.atabs i{font-style:normal;background:var(--ice);color:var(--bl);border:1px solid var(--ln);border-radius:99px;padding:0 8px;font-size:14px}
.apanel{padding-top:16px}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tool input{flex:1;min-width:170px;font:400 16px "Source Sans 3",Arial,sans-serif;padding:9px 12px;border:1.5px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:14px 0 20px}
.stat{background:var(--ice);border:1px solid var(--ln);border-top:5px solid var(--sk);border-radius:10px;padding:14px 16px;display:grid;gap:6px;justify-items:start}
.stat b{font:700 46px/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--lg)}
.how-t{font-size:26px;color:var(--lg);margin-bottom:6px}
.how{margin:0;padding-left:22px;color:var(--mu)}
.okm{color:#13744a;font-weight:600;background:#e6f6ee;border:1px solid #b8e3cc;border-radius:8px;padding:8px 12px;margin:10px 0}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:0 9px;border-radius:99px;background:var(--ice);color:var(--bl);border:1px solid var(--ln);margin-right:6px}
.chip.g{background:#e6f6ee;color:#13744a;border-color:#b8e3cc}.chip.r{background:#ffe3e3;color:#c01b1f;border-color:#f6bcbc}
.arow:hover{background:var(--ice)}
.frm{grid-template-columns:repeat(2,minmax(0,1fr))}
.frm .full,.frm fieldset,.frm>div,.frm>p{grid-column:1/-1}
.fh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.fh h2{font-size:32px;color:var(--lg)}
.logoup{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logoup img{height:72px;background:#fff;border:1px solid var(--ln);border-radius:8px;padding:4px}
.logoup input{width:auto!important}
@media(max-width:700px){.frm{grid-template-columns:1fr}.logo img{height:60px}}
/* 11c. EFECTOS AVANZADOS (cabecera adhesiva, revelado al desplazar, inclinación 3D, ondas, brillo, paralaje) */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sf)}
#prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;width:0;background:linear-gradient(90deg,var(--sk),var(--bl));z-index:61;transition:width .12s linear}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--sf);background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:saturate(1.4) blur(10px);transition:box-shadow .3s}
.head .wrap{transition:padding .3s}.logo img{transition:height .3s}
body.sc .head{box-shadow:0 10px 26px rgba(10,42,94,.18)}
body.sc .logo img{height:54px}body.sc .head .wrap{padding-top:6px;padding-bottom:6px}
body.isadm .head{position:static}
.pg{animation:fade .5s ease}
@keyframes fade{from{opacity:0;translate:0 10px}}
.rv{opacity:0;translate:0 30px;transition:opacity .7s ease calc(var(--i,0)*80ms),translate .7s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*80ms)}
.rv.in{opacity:1;translate:0 0}
[data-tilt]{position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.rv[data-tilt]{transition:opacity .7s ease calc(var(--i,0)*80ms),translate .7s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*80ms),transform .25s ease,box-shadow .25s}
[data-tilt]::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.34),transparent 55%);opacity:0;transition:opacity .3s;z-index:3}
[data-tilt]:hover::after{opacity:1}
[data-tilt]:hover{box-shadow:0 18px 40px rgba(20,86,214,.24)}
.btn,.b,.rb,.job,.cc-b{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.btn:hover,.b:hover{filter:brightness(1.08);box-shadow:0 6px 16px rgba(20,86,214,.3)}
.btn:active,.b:active,.rb:active{transform:scale(.96)}
.job::before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,194,14,.4),transparent);transform:skewX(-20deg);transition:left .7s;pointer-events:none}
.job:hover::before{left:130%}
nav a{position:relative}
nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:3px;border-radius:3px;background:var(--sk);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
nav a:hover::after{transform:scaleX(1)}
.card img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}.card:hover img{transform:scale(1.08)}
.big img{translate:var(--px,0px) var(--py,0px);transition:translate .35s ease-out}
.ph{position:relative}
.ph::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--sk),transparent);transition:width 1.1s ease .2s}
.pn.in .ph::after{width:100%}
.radiocard{background:linear-gradient(120deg,var(--nv),var(--bl),var(--nv));background-size:220% 220%;animation:flow 9s ease infinite}
@keyframes flow{50%{background-position:100% 50%}}
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:24px;margin-left:10px;vertical-align:middle}
.eq i{width:4px;height:30%;background:var(--sk);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.2s}.eq i:nth-child(3){animation-delay:-.45s}.eq i:nth-child(4){animation-delay:-.7s}.eq i:nth-child(5){animation-delay:-.1s}
@keyframes eq{50%{height:100%}}
.jobsP::before,.jobsP::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,194,14,.38),transparent 70%);animation:float 9s ease-in-out infinite;pointer-events:none}
.jobsP::before{width:340px;height:340px;right:-80px;top:-100px}.jobsP::after{width:260px;height:260px;left:-60px;bottom:-90px;animation-delay:-4s}
@keyframes float{50%{transform:translate(-30px,24px) scale(1.12)}}
.jobsP .ph,.jobsP .pb{position:relative;z-index:1}
.tick:hover div{animation-play-state:paused}
.mini{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--ln);text-decoration:none;align-items:center}
.mini:first-child{border-top:0;padding-top:0}
.mini img{width:84px;aspect-ratio:1;object-fit:cover;border-radius:8px;transition:filter .3s}
.mini:hover img{filter:brightness(1.12) saturate(1.3)}
.mini h3{font-size:21px;font-weight:700;margin:3px 0 1px}.mini:hover h3{color:var(--bl)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.cc{display:flex;flex-direction:column;gap:10px;background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--bl);border-radius:12px;padding:18px;text-decoration:none;overflow:hidden}
.cc.u{border-left-color:#e5252a}
.cc-h{display:flex;align-items:center;gap:12px}
.cc-i{width:46px;height:46px;border-radius:12px;background:var(--ice);color:var(--bl);display:grid;place-items:center;flex:none;transition:transform .3s}
.cc:hover .cc-i{transform:rotate(-12deg) scale(1.12)}
.cc.u .cc-i{background:#ffe3e3;color:#c01b1f}
.cc h3{font-size:26px;font-weight:700}
.cc-s{margin:0;color:var(--mu);font-size:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cc-d{margin:0;display:grid;gap:6px;border-top:1px dashed var(--ln);padding-top:10px;font-size:15px}
.cc-d div{display:grid;grid-template-columns:100px 1fr;gap:8px}
.cc-d dt{color:var(--mu);font-weight:600}.cc-d dd{margin:0;overflow-wrap:anywhere}
.cc-b{margin-top:auto;align-self:flex-start;color:var(--bl);font-weight:600;padding:6px 0;transition:letter-spacing .25s}
.cc:hover .cc-b{letter-spacing:.03em}
.urgdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e5252a;margin-right:6px;animation:pulse 1.4s infinite}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.rank{position:absolute;top:10px;left:10px;z-index:2;min-width:36px;height:36px;border-radius:99px;background:var(--sk);color:#04142e;font:700 22px/36px "Barlow Condensed","Arial Narrow",Arial,sans-serif;text-align:center;padding:0 8px;box-shadow:0 4px 10px rgba(0,0,0,.28)}
#up{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--bl);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 8px 20px rgba(10,42,94,.35);opacity:0;translate:0 20px;pointer-events:none;transition:opacity .3s,translate .3s;z-index:55}
body.sc #up{opacity:1;translate:0 0;pointer-events:auto}
body.hasbar #up{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.okm,.err{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}}
.abar{top:env(safe-area-inset-top,0px)}
@media(hover:none){[data-tilt]{transform:none!important}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;translate:none}}
.grid .card:only-child{display:grid;grid-template-columns:minmax(0,380px) 1fr;align-items:center}.grid .card:only-child img{height:100%;min-height:220px;aspect-ratio:auto}
@media(max-width:700px){.grid .card:only-child{display:block}.grid .card:only-child img{height:auto;min-height:0;aspect-ratio:16/9}}
/* 11d. RADIO FIJA, TEMA CLARO/OSCURO Y MÁS EFECTOS */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:58;transform:translateY(112%);transition:transform .55s cubic-bezier(.2,.8,.2,1);background:var(--nv);color:#fff;border-top:3px solid var(--sk);box-shadow:0 -14px 36px rgba(4,18,42,.42)}
#dock.open{transform:none}
.dk-draw{display:none;max-width:1160px;margin:0 auto;padding:14px 18px 0}
#dock.emb .dk-draw{display:block;animation:up .5s both}
.dk-draw iframe{width:100%;height:min(430px,52vh);border:0;border-radius:12px;background:#0b1b33}
.dk-help{margin:8px 0 0;font-size:14px;opacity:.9}.dk-help a{color:var(--sk)}
.dk-bar{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px))}
.dk-bar button{border:0;cursor:pointer;font:600 15px "Source Sans 3",Arial,sans-serif}
#dkp{width:46px;height:46px;border-radius:50%;background:var(--sk);color:#04142e;font-size:18px;flex:none;transition:transform .2s}
#dkp:hover{transform:scale(1.1)}
#dkt{background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:8px 14px}
#dkx{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:16px;flex:none;transition:transform .3s,background .3s}
#dkx:hover{transform:rotate(90deg);background:rgba(229,37,42,.7)}
.dk-t{flex:1;min-width:0;line-height:1.2}.dk-t b{display:flex;align-items:center;gap:8px}.dk-t span{font-size:14px;opacity:.88}
.dk-t .eq i{animation-play-state:paused}#dock.play .dk-t .eq i{animation-play-state:running}
#dkv{width:100px;accent-color:var(--sk)}
#dock.st #dkt,#dock:not(.st) #dkp,#dock:not(.st) #dkv{display:none}
body.hasbar{padding-bottom:84px}
@media(max-width:700px){#dkv{display:none}}
.tr{display:flex;gap:10px;align-items:center}
.tg{background:rgba(255,255,255,.16);color:#fff;border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:transform .6s cubic-bezier(.3,1.4,.5,1),background .3s}
.tg:hover{background:rgba(255,255,255,.3)}.tg.spin{transform:rotate(360deg)}
.tg .sun{display:none}
:root[data-theme="dark"] .tg .sun{display:block}:root[data-theme="dark"] .tg .moon{display:none}

#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg i{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 24s ease-in-out infinite}
#bg i:nth-child(1){width:460px;height:460px;left:-120px;top:120px;background:rgba(76,194,255,.34)}
#bg i:nth-child(2){width:420px;height:420px;right:-100px;top:40%;background:rgba(20,86,214,.2);animation-delay:-8s}
#bg i:nth-child(3){width:380px;height:380px;left:30%;bottom:-140px;background:rgba(255,194,14,.2);animation-delay:-15s}
@keyframes drift{50%{transform:translate(70px,-50px) scale(1.18)}}
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px circle at var(--sx,50%) var(--sy,25%),rgba(76,194,255,.22),transparent 62%)}
.btn,.rb{transition:translate .25s ease,filter .2s,box-shadow .2s}
.btn::before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .6s;pointer-events:none}
.btn:hover::before{left:140%}
.big h1 span{display:inline-block;animation:wd .85s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--w)*70ms + .25s)}
@keyframes wd{from{opacity:0;translate:0 26px;filter:blur(8px)}}
footer{position:relative;margin-top:60px}
footer::before{content:"";position:absolute;left:0;right:0;top:-39px;height:40px;background:var(--nv);-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 40' preserveAspectRatio='none'><path d='M0 22 Q100 0 200 22 T400 22 T600 22 T800 22 V40 H0Z'/></svg>") repeat-x 0 0/800px 40px;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 40' preserveAspectRatio='none'><path d='M0 22 Q100 0 200 22 T400 22 T600 22 T800 22 V40 H0Z'/></svg>") repeat-x 0 0/800px 40px;animation:wv 14s linear infinite}
@keyframes wv{to{-webkit-mask-position:800px 0;mask-position:800px 0}}
.share{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 4px;padding-top:14px;border-top:1px dashed var(--ln);font-weight:600}
.share .b{padding:6px 14px;font-size:15px}
/* 12. PIE Y BARRA DE RADIO */
footer{background:var(--nv);color:#fff;padding:24px 0;font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 30px}
.radio{position:fixed;left:0;right:0;bottom:0;background:var(--nv);color:#fff;z-index:20;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--sk)}
.radio .wrap{display:flex;align-items:center;gap:14px}
.radio button{width:44px;height:44px;border-radius:50%;border:0;background:var(--sk);color:#04142e;font-size:18px;cursor:pointer;flex:none}
.radio .t{flex:1;line-height:1.2;min-width:0}.radio .t b{display:flex;align-items:center;gap:8px}.radio .t span{font-size:14px;opacity:.85}
.radio input{width:90px;accent-color:var(--sk)}
/* 13. PANTALLAS PEQUEÑAS */
@media(max-width:900px){.top2{grid-template-columns:1fr}.big{min-height:320px}.radio input{display:none}}

  else S[COL[tab]]=S[COL[tab]].filter(function(y){return y.id!=d.id});dirty=true;return admin()}
 if(a==="cok"){SCH.config.forEach(function(f){S.cfg[f[0]]=$("#f_"+f[0]).value.trim()});dirty=true;msg="✓ Ajustes guardados. Recuerda pulsar Publicar cambios.";return admin()}
 if(a==="ok"){var o=ed.id?ed.o:{id:nid(S[COL[tab]])};SCH[tab].forEach(function(f){var e=$("#f_"+f[0]);o[f[0]]=f[2]==="chk"?e.checked:e.value.trim()});

  if(!ed.id)S.users.push(t);ed=null;dirty=true;msg="✓ Usuario guardado. Recuerda pulsar Publicar cambios.";return admin()}
 if(a==="save"){A=A||(window.claude?await claude.use("artifact"):null);if(!A){msg="No se puede publicar desde aquí. Abre la página con tu cuenta de Claude (el enlace de la página publicada) y vuelve a pulsar Publicar cambios.";return admin()}
  var doc='<!DOCTYPE html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+E(S.cfg.name)+'</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap"><style id="css">'+$("#css").textContent+'</style></head><body><div id="root"></div><script type="application/json" id="data">'+JSON.stringify(S).replace(/</g,"\\u003c")+"<"+"/script><script id=\"app\">"+$("#app").textContent+"<"+"/script></body></html>";
  msg="Publicando…";admin();
  try{await A.publish(doc);dirty=false}catch(e){var c=e&&e.code;msg=c==="conflict"?"La página se actualizó mientras editabas y se está recargando con la última versión.":c==="not_writer"||c==="not_granted"?"Tu cuenta de Claude no tiene permiso de edición sobre esta página. Pide acceso de editor al dueño.":c==="consent_required"?"Acepta el permiso de publicación que muestra Claude y vuelve a pulsar Publicar cambios.":c==="too_large"?"La página es demasiado grande. Quita publicaciones antiguas o usa un logo más liviano.":c==="rate_limited"?"Espera unos segundos y vuelve a pulsar Publicar cambios.":"No se pudo publicar ("+(c||"error")+"). Intenta de nuevo.";admin()}}
